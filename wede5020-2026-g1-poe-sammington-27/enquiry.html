<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Tailored & Alterations | Clothing Alterations and Custom Tailoring</title>
    <meta name="description" content="Professional clothing alterations, repairs and custom tailoring. Perfect fit, every time. Book your alteration today.">
    <meta name="keywords" content="tailor, clothing alterations, custom tailoring, suit alterations, trouser hemming, garment repairs">
    <link rel="stylesheet" href="./CSS/style.css">
   <script src="js/script.js"></script>
</head>
<body>
    <header>
        <h1>Whatever questions you have we will assist!</h1>
        <p class="tagline">Perfect Fit. Every Time</p>
        
       <nav>
        <!--navigation-->
        <ul> 
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        </nav>
    </header>
    <main id="enquiry">
        <div class="form-container">
            <h2>Send Us an Equiry</h2>
        </div>

    <form id="enquiryForm" action="https://formspree.io/f/YOUR_ID" method="POST">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
    </div>
    <div class="form-group">
        <label for="mytel">Telephone</label>
        <input type="tel" id="mytel" name="telephone" placeholder="0821234567">
    </div>
    <div class="form-group">
        <label for="serviceType">Service</label>
        <select id="serviceType" name="service"></select>
    </div>
    <div class="form-group">
        <label for="itemCount">Number of items</label>
        <input type="number" id="itemCount" name="items" min="1" max="20">
    </div>
    <div class="form-group">
        <label for="dropoffDate">Drop-off date</label>
        <input type="date" id="dropoffDate" name="dropoff">
    </div>
    <div class="form-group">
        <label for="message">Enquiry</label>
        <textarea id="message" name="message" rows="6"></textarea>
    </div>
    <div class="form-group">
        <button type="button" onclick="validateEnquiry()">Submit</button>
        <button type="reset" onclick="clearEnquiry()">Clear</button>
    </div>
    <div id="enquiryErrors" class="form-errors"></div>
    <div id="formResponse" class="form-response"></div>
</form>
    </div>
    </main>
    <footer>
        <p>&copy;2026 Precision Tailored Alterations. All rights reserved</p>
    </footer>
    
</body>
</html>
